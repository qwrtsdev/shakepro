name: shake_cam_voice_recorder
description: Shake-to-capture camera + voice recorder (Android only).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.0+2
  sensors_plus: ^6.1.1
  record: ^6.2.1
  audioplayers: ^6.1.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
