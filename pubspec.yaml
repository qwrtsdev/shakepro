name: shake_cam_voice_recorder
description: Shake-to-capture camera + voice recorder (Android only).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.0+2          # camera preview + capture
  sensors_plus: ^6.1.1       # accelerometer for shake detection
  record: ^6.2.1             # audio recording
  audioplayers: ^6.1.0       # audio playback
  permission_handler: ^11.3.1
  path_provider: ^2.1.4      # app storage path

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
